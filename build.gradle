plugins {
    id 'groovy'
    id 'java-library'
    id 'maven-publish'
}

group = 'com.mentalresonance'
version = '2.0'

repositories {
    mavenLocal()
    mavenCentral()
    // Needed to get spock snapshot below
    maven { url 'https://oss.sonatype.org/content/repositories/snapshots' }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withSourcesJar()
}

dependencies {
    implementation 'commons-lang:commons-lang:2.6'
    compileOnly 'org.slf4j:slf4j-simple:2.0.7'
    compileOnly 'org.apache.groovy:groovy-all:4.0.12'

    compileOnly 'org.projectlombok:lombok:1.18.30'
    annotationProcessor 'org.projectlombok:lombok:1.18.30'

    api 'org.jsoup:jsoup:1.15.3'
    api 'com.mentalresonance:dust-core:2.0'

    // This version for Java 21
    testImplementation 'org.spockframework:spock-core:2.4-M7-groovy-4.0'
    testImplementation 'org.projectlombok:lombok:1.18.30'
    testImplementation 'org.slf4j:slf4j-simple:2.0.7'
    testImplementation 'com.mentalresonance:dust-http:2.0'
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
}

test {
    useJUnitPlatform()
    jvmArgs([
        '-Xmx4g',
        '--add-opens=java.base/java.lang=ALL-UNNAMED',
        '--add-opens=java.base/java.math=ALL-UNNAMED',
        '--add-opens=java.base/java.util=ALL-UNNAMED',
        '--add-opens=java.base/java.util.concurrent=ALL-UNNAMED',
        '--add-opens=java.base/java.net=ALL-UNNAMED',
        '--add-opens=java.base/java.text=ALL-UNNAMED',
        '--add-opens=java.sql/java.sql=ALL-UNNAMED',
    ])

}

tasks.withType(JavaCompile).each {
    // it.options.compilerArgs.add('-Xlint:preview')
}

tasks.withType(GroovyCompile).each {
}
java {
    withSourcesJar()
}